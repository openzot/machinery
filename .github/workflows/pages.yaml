# Publish site/ to GitHub Pages.
#
# Publishing is deliberately separate from the shift. A shift's job is to make
# a machine; getting the result onto the web is a different concern with a
# different failure mode, and folding the two together meant a shift that was
# cancelled or that ran out of clock left the site stale even though `main`
# already had the new machine on it. Anything that lands on main under site/ - a
# shift's commit, a hand edit, a subtree push - publishes here within a minute.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/check.sh'
      - '.github/workflows/pages.yaml'

  # A push made with GITHUB_TOKEN raises no events, so the shift's own commit
  # never triggers the push above. The shift dispatches this instead, the same
  # way it dispatches the backmerge.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a running one finish: a cancelled deploy can
# leave the Pages environment mid-update, and the queued run publishes the same
# tree a moment later anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Only a valid catalogue is published. A broken one stays committed - the
      # history is honest and the next shift is told to repair it - but the
      # live site keeps serving the last good tree rather than a broken index.
      - name: Check the catalogue
        run: scripts/check.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Report
        if: always()
        run: |
          {
            echo "## Pages"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| commit | ${GITHUB_SHA:0:7} |"
            echo "| site | ${{ steps.deploy.outputs.page_url || 'not deployed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
